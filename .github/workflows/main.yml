name: Build CE-Bridge 26.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate CraftEngine JAR
        run: |
          echo "Verifying server/libs/ CraftEngine JAR integrity..."
          sha256sum server/libs/*.jar

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --warning-mode all

      - name: Upload Server Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ce-bridge-server-plugin
          path: server/build/libs/CraftEngineClientBridge-*.jar
          retention-days: 30
          if-no-files-found: error

      - name: Upload Client Mod Artifact (26.2)
        uses: actions/upload-artifact@v4
        with:
          name: ce-bridge-client-mod-26.2
          path: client/build/libs/CraftEngineClientMod-*.jar
          retention-days: 30
          if-no-files-found: error
